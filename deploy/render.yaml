# Draft Render Blueprint for the public SANDBOX demo. NOT RUN, not deployed yet.
services:
  - type: web
    name: jaay-demo
    runtime: node
    # A paid plan is needed: persistent disks are not available on free services.
    plan: starter
    # Pick the region closest to your users.
    region: frankfurt
    numInstances: 1
    buildCommand: corepack enable && pnpm install --frozen-lockfile --production=false && pnpm build
    startCommand: node apps/server/dist/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SANDBOX
        value: "1"
      - key: JAAY_FX_FIXED_XOF_PER_BTC
        value: "40000000"
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: /data/jaay.sqlite
      - key: JAAY_POS_DIR
        value: apps/pos/dist
      - key: JAAY_SIM_DIR
        value: apps/customer-sim/dist
      # Exact public https origin, for example https://jaay-demo.onrender.com
      - key: JAAY_BASE_URL
        sync: false
      # 32 random bytes, base64. Prompted in the dashboard, never committed.
      - key: JAAY_MASTER_KEY
        sync: false
    disk:
      name: jaay-data
      mountPath: /data
      sizeGB: 1
